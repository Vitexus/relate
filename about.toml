# cargo-about config for THIRDPARTY-NOTICES.md (scripts/third-party-licenses.py).
# The accepted list must stay equal to deny.toml's `allow`; the script's
# `policy` step fails closed on a mismatch.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what ships: dev-dependencies never reach a release binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false
