# License policy for everything that ships in a Relate binary release
# (scripts/third-party-licenses.py policy; the release workflow's
# `licenses` job). The allow-list is the Apache-2.0-compatible set that the
# shipped dependency closure uses today; a new license is a deliberate edit
# here AND in about.toml, never an accident.
[graph]
exclude-dev = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# One manifest sees only part of the closure, so an entry unused by this
# crate is normal; the union is what the allow-list describes.
unused-allowed-license = "allow"
