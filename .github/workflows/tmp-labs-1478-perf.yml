# TEMPORARY (LABS-1478): settles the expansion_3 discrepancy. Times main and
# the memo head in two modes on one runner: one group per process, and the
# whole suite in one process. Delete with the PR; never merge.
name: tmp-labs-1478-perf
on:
  push:
    branches: [perf/labs-1478-memo-v2]
    paths:
      - .github/workflows/tmp-labs-1478-perf.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: interleaved timing rounds
        default: "3"
jobs:
  perf:
    runs-on: linux-4-core-x86
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: /home/runner/work/shared-target
      VARIANTS: "main1:38482a98 v2:HEAD"
    steps:
      - uses: actions/checkout@v4
        with: { path: repo, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: runner identity
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|L3 cache'
          free -m | head -2
      - name: build every variant
        run: |
          mkdir bins
          for v in $VARIANTS; do
            n="${v%%:*}"; s="${v##*:}"
            if [ "$s" = HEAD ]; then s=$(git -C repo rev-parse HEAD); fi
            git -C repo worktree add "../wt_$n" "$s"
            (cd "wt_$n" && cargo build --release -p relate-query-latency --bin pokec_profile && cp "$CARGO_TARGET_DIR/release/pokec_profile" "../bins/$n")
          done
      - name: isolated, one group per process
        run: |
          rounds="${{ github.event.inputs.rounds || '3' }}"
          for r in $(seq "$rounds"); do
            for v in $VARIANTS; do
              n="${v%%:*}"
              echo "== iso $n"; ./bins/$n medium --group expansion_3 | grep -E ': [0-9]+ ms'
            done
          done | tee iso.txt
      - name: whole suite in one process
        run: |
          rounds="${{ github.event.inputs.rounds || '3' }}"
          for r in $(seq "$rounds"); do
            for v in $VARIANTS; do
              n="${v%%:*}"
              echo "== full $n"; ./bins/$n medium | grep -E ': [0-9]+ ms'
            done
          done | tee full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: labs-1478-perf
          path: |
            iso.txt
            full.txt
