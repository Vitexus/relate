# TEMPORARY (LABS-1478): bisects the expansion_3 regression of the rebased
# memo. Times five binaries interleaved on one runner. Delete with the PR;
# never merge.
name: tmp-labs-1478-perf
on:
  push:
    branches: [perf/labs-1478-memo-v2]
    paths:
      - .github/workflows/tmp-labs-1478-perf.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: interleaved timing rounds
        default: "4"
jobs:
  perf:
    runs-on: linux-4-core-x86
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /home/runner/work/shared-target
      # name:sha. main1/v2 share a base; main2/bitmap share a base; old is
      # the original measured head on its original base (the control).
      VARIANTS: "main1:38482a98 v2:HEAD main2:b3473a1a bitmap:adac86bc old:50eaaa15"
    steps:
      - uses: actions/checkout@v4
        with: { path: repo, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: build every variant
        run: |
          mkdir bins
          for v in $VARIANTS; do
            n="${v%%:*}"; s="${v##*:}"
            if [ "$s" = HEAD ]; then s=$(git -C repo rev-parse HEAD); fi
            git -C repo worktree add "../wt_$n" "$s"
            (cd "wt_$n" && cargo build --release -p relate-query-latency --bin pokec_profile && cp "$CARGO_TARGET_DIR/release/pokec_profile" "../bins/$n")
          done
      - name: timed expansion_3, interleaved
        run: |
          rounds="${{ github.event.inputs.rounds || '4' }}"
          for r in $(seq "$rounds"); do
            for v in $VARIANTS; do
              n="${v%%:*}"
              echo -n "$n: "; ./bins/$n medium --group expansion_3 | grep 'expansion_3:'
            done
          done | tee ab.txt
      - name: sampled runs
        run: |
          for v in $VARIANTS; do
            n="${v%%:*}"
            ./bins/$n medium --group expansion_3 --sample "sample_$n"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: labs-1478-perf
          path: |
            ab.txt
            sample_*
